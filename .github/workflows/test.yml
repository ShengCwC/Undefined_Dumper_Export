name: Export tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project tests/Undefined.StringDumper.Export.Tests -c Release
      - name: Parse Windows PowerShell entry point
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd 'Export-Dumper.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
